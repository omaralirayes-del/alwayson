name: Build Light APKs (v7a + v8a)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Split APKs (v7a + v8a)
        run: >
          flutter build apk --release
          --split-per-abi
          --target-platform android-arm,android-arm64
          --obfuscate
          --split-debug-info=build/debug-info
          --tree-shake-icons

      - name: Show APK Info
        run: |
          ls -lh build/app/outputs/flutter-apk/*.apk
          BT=$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          for APK in build/app/outputs/flutter-apk/*-release.apk; do
            echo "=== $APK ==="
            $ANDROID_HOME/build-tools/$BT/aapt dump badging $APK | grep -E "sdkVersion|native-code"
          done

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: app-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
